name: Deno CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run linter
        run: deno lint

      - name: Run unit tests with coverage
        run: deno test -A --coverage=coverage/

      - name: Report code coverage
        run: deno coverage coverage/

      - name: Enforce coverage threshold (e.g., 80%)
        run: deno coverage coverage/ --fail-under=80
